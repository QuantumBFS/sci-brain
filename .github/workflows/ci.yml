name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills + run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Validate skill frontmatter (Agent Skills spec)
        run: python3 scripts/validate_skills.py

      - name: Run test suite
        run: pytest -q

      - name: Whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            git diff --check HEAD~1..HEAD || git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Verify npm package builds
        run: npm pack --dry-run
