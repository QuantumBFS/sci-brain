name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (no long-lived token)

jobs:
  publish:
    name: Publish sci-brain to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm trusted publishing requires Node >= 22.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate skill frontmatter
        run: python3 scripts/validate_skills.py

      - name: Run tests
        run: pip install pytest && pytest -q

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi

      # --access public is required on the first publish of an unscoped package.
      # Provenance attestations are generated automatically with trusted publishing.
      - name: Publish (trusted publishing / OIDC)
        run: npm publish --provenance --access public
